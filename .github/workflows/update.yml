name: Update prices

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the tests
        run: |
          python -m unittest discover -b -s tests
          node --test tests/*.test.js
          pip install --quiet lupa
          python tests/addon/nodes_sim.py > /dev/null
          python tests/addon/scan_sim.py > /dev/null

      - name: Get saved prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state \
            || mkdir -p state
          rm -rf state/.git

      - name: Fetch prices
        id: collect
        continue-on-error: true
        run: python collector/collect.py --out state

      - name: Save prices
        if: steps.collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Latest prices"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          rm -rf .git

      - name: Build the site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          python tools/build_addon_zip.py _site/downloads/GatheringTracker.zip
          cp -r state/. _site/data/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failed fetch
        if: steps.collect.outcome != 'success'
        run: |
          echo "::warning::Prices were not updated. See the Fetch prices step."
          exit 1
