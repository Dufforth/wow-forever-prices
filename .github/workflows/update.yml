name: Update prices

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # A quick look at Blizzard's timestamps, so a full update runs right after new prices appear.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Get saved prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state \
            || mkdir -p state

      - name: Look for new prices
        id: check
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python3 collector/collect.py --check --out state --region us

  update:
    needs: check
    if: ${{ always() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: prices
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the tests
        run: |
          python -m unittest discover -b -s tests
          node --test tests/*.test.js
          pip install --quiet lupa
          python tests/addon/nodes_sim.py > /dev/null
          python tests/addon/scan_sim.py > /dev/null

      - name: Get saved prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state \
            || mkdir -p state
          rm -rf state/.git

      - name: Fetch prices
        id: collect
        continue-on-error: true
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python collector/collect.py --out state --region us

      - name: Save prices
        if: steps.collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Latest prices"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          rm -rf .git

      - name: Build the site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          python tools/build_addon_zip.py _site/downloads
          cp -r state/. _site/data/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failed fetch
        if: steps.collect.outcome != 'success'
        run: |
          echo "::warning::Prices were not updated. See the Fetch prices step."
          exit 1
